[runtime]
sampler = emcee #maxlike #emcee
#likelihoods = mass_function_xt
root = ${PWD}
resume = F
verbosity = debug #quiet

#[test] ;this section is not been used by cosmosis 
#save_dir=mf_xt/output/test/hmf_counts_v1


[emcee]
walkers = 12
samples = 600
#burn = 600 #do this in post-processing
#save_all_parameters = F
#output_every = 10
#proposal_scale = 1.0

#[maxlike] this can be used if we are doing a maxlike sampler not a emcee, if we want to find the quick best-fit without sampling, ask xin about it 
#output_ini = mf_xt/output/mf_manual_v3.ini
#tolerance = 1e-6

[output]
filename = mf_xt/output/desy1_abundance_fit_v3_nocorrection.txt
format = text
lock = F
new_file = T

[pipeline]
modules = mass_function_like  
values = mf_xt/values/values_desy1.ini
likelihoods = hmf
#priors = mf_xt/priors_fit.ini
timing = T

[prior]
omega_m = uniform 0.0 1.0
sigma8_input = uniform 0.6 1.0
#sigma0  = uniform 0.05 0.4 ;v2: prior for nuisance parameter

[likelihoods]
mass_function_like = hmf

[mass_function_like]
file = mf_xt/likelihoods/desy1_abundance_like.py
data_file = mf_xt/data/desy1_abundance_data.txt
area_deg2 = 1500.0
mass_min = 5.0e13
mass_max = 3.0e15
dlog10m = 0.02
n_z = 4
use_scatter = T